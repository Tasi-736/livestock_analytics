services:
  - type: web
    name: livestocklens
    runtime: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --timeout 180 app:app
    healthCheckPath: /api/status
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.11
